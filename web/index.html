<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta name="description" content="Aspire Healthspan Web App" />

    <!-- iOS meta tags & icons -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Aspire Healthspan" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="icons/favicon.png" />

    <!-- Base path -->
    <base href="/" />

    <title>Aspire Healthspan</title>

    <!-- Web App Manifest -->
    <link rel="manifest" href="manifest.json" />

    <!-- Preload critical resources -->
    <link rel="preload" href="main.dart.js" as="script">
    <link rel="preload" href="favicon.png" as="image">

    <!-- Flutter Bootstrap -->
    <script src="flutter_bootstrap.js" defer></script>

    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">

    <!-- Splash screen style -->
    <style id="splash-screen-style">
        html, body {
          margin: 0;
          padding: 0;
          height: 100%;
          background-color: #ffffff;
        }
        .center {
          position: absolute;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
        }
    </style>
</head>

<body>
<script defer>
    // Register Firebase Messaging Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker
        .register('firebase-messaging-sw.js')
        .then((registration) => {
          console.log('Service Worker registered:', registration);
        })
        .catch((err) => {
          console.error('Service Worker registration failed:', err);
        });
    }
</script>
<!-- Splash using favicon.png with full <picture> flow -->
<picture id="splash">
    <source
            srcset="icons/favicon.png 1x, icons/favicon.png 2x, icons/favicon.png 3x, icons/favicon.png 4x"
            media="(prefers-color-scheme: light)">
    <source
            srcset="icons/favicon.png 1x, icons/favicon.png 2x, icons/favicon.png 3x, icons/favicon.png 4x"
            media="(prefers-color-scheme: dark)">
    <img class="center" aria-hidden="true" src="favicon.png" alt="Splash logo">
</picture>

</body>
</html>
