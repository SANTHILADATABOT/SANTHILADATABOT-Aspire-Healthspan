<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
  <meta name="description" content="Aspire Healthspan Web App" />

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Aspire Healthspan" />
  <link rel="apple-touch-icon" href="icons/Icon-192.png" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <!-- Base path for Flutter web app (replace $FLUTTER_BASE_HREF if not using --base-href) -->
  <base href="/web/" />

  <title>Aspire Healthspan</title>

  <!-- Web App Manifest -->
  <link rel="manifest" href="manifest.json" />

  <!-- Flutter Bootstrap -->
  <script src="flutter_bootstrap.js" defer></script>
</head>

<body>
<script>
  // Register Firebase Messaging Service Worker
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker
      .register('firebase-messaging-sw.js')
      .then((registration) => {
        console.log('✅ Service Worker registered:', registration);
      })
      .catch((err) => {
        console.error('❌ Service Worker registration failed:', err);
      });
  }
</script>
</body>
</html>
